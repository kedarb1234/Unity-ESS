<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertifDB — UnityESS BESS Certification Database</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f8f9fa;--white:#ffffff;--border:#e5e7eb;--text:#1f2937;--text-sec:#6b7280;--text-mut:#9ca3af;
--sh-sm:0 1px 2px rgba(0,0,0,.05);--sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);--sh-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);--sh-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
--r:8px;--rl:12px;
--c-safety:#22c55e;--c-emc:#3b82f6;--c-perf:#a855f7;--c-fire:#ef4444;--c-transport:#f97316;--c-compliance:#6b7280;--c-env:#14b8a6;--c-comm:#06b6d4;--c-other:#9ca3af;
--tr:all .2s ease;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
.header{position:sticky;top:0;z-index:100;background:var(--white);border-bottom:1px solid var(--border);box-shadow:var(--sh-sm);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{height:36px;width:auto}
.header-center{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.header-title{font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
.header-subtitle{font-size:11px;color:var(--text-sec);text-transform:uppercase;letter-spacing:1.5px;font-weight:500}
.badge-internal{background:#1f2937;color:#fff;font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:1px;text-transform:uppercase}
.tab-bar{display:flex;gap:0;background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto}
.tab-btn{padding:12px 20px;font-size:14px;font-weight:500;color:var(--text-sec);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:var(--tr);white-space:nowrap}
.tab-btn:hover{color:var(--text);background:#f3f4f6}
.tab-btn.active{color:#1f2937;border-bottom-color:#1f2937;font-weight:600}
.main{max-width:1400px;margin:0 auto;padding:24px}
.tab-content{display:none;animation:fadeIn .3s ease}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.stats-bar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;align-items:stretch}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:12px 18px;display:flex;flex-direction:column;min-width:100px;box-shadow:var(--sh-sm)}
.stat-card .sv{font-size:24px;font-weight:700;color:var(--text)}
.stat-card .sl{font-size:11px;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.stat-card.st-avail .sv{color:var(--c-safety)}
.stat-card.st-draft .sv{color:#f59e0b}
.stat-card.st-pend .sv{color:var(--text-mut)}
.oem-badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.oem-mini{background:#f3f4f6;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500;color:var(--text-sec);display:flex;align-items:center;gap:4px}
.oem-mini .ct{font-weight:700;color:var(--text)}
.filter-bar{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:16px 20px;margin-bottom:20px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:12px}
.filter-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filter-input{flex:1;min-width:200px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--r);font-size:14px;outline:none;transition:var(--tr)}
.filter-input:focus{border-color:#6b7280;box-shadow:0 0 0 2px rgba(107,114,128,.15)}
.filter-select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--white);cursor:pointer;outline:none;color:var(--text)}
.cat-pills{display:flex;flex-wrap:wrap;gap:6px}
.cat-pill{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid var(--border);background:var(--white);cursor:pointer;transition:var(--tr);color:var(--text-sec)}
.cat-pill:hover{border-color:#9ca3af}
.cat-pill.active{color:#fff;border-color:transparent}
.btn-clear{padding:6px 14px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;font-weight:500;background:var(--white);cursor:pointer;color:var(--text-sec);transition:var(--tr)}
.btn-clear:hover{background:#f3f4f6;color:var(--text)}
.results-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:var(--text-sec)}
.sort-select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--white);cursor:pointer}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.cert-card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh-sm);transition:var(--tr);cursor:pointer;position:relative}
.cert-card:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.cert-card-inner{display:flex}
.cert-card-border{width:4px;flex-shrink:0}
.cert-card-body{flex:1;padding:16px 18px}
.cert-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.oem-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:#f3f4f6;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px}
.status-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.status-badge.available{background:#dcfce7;color:#166534}
.status-badge.draft{background:#fef3c7;color:#92400e}
.status-badge.pending{background:#f3f4f6;color:#6b7280}
.cert-std{font-size:16px;font-weight:600;margin-bottom:4px;color:var(--text)}
.cert-product{font-size:12px;color:var(--text-sec);margin-bottom:8px}
.cert-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
.chip-comp{background:#eff6ff;color:#1e40af}
.chip-cat{color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.cert-file{font-size:11px;color:var(--text-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cert-details{display:none;padding:12px 18px 16px;border-top:1px solid var(--border);background:#fafafa;font-size:13px;color:var(--text-sec);line-height:1.7}
.cert-card.expanded .cert-details{display:block;animation:fadeIn .2s ease}
.cert-details p{margin-bottom:6px}
.cert-details .dl{font-weight:600;color:var(--text)}
.drive-btn{display:inline-block;margin-top:8px;padding:6px 14px;background:#1f2937;color:#fff;text-decoration:none;border-radius:var(--r);font-size:12px;font-weight:500;transition:var(--tr)}
.drive-btn:hover{background:#374151}
.drive-pending{display:inline-block;margin-top:8px;padding:6px 14px;background:#f3f4f6;color:var(--text-mut);border-radius:var(--r);font-size:12px;font-weight:500}
.drive-browse{background:#2563eb!important}.drive-browse:hover{background:#1d4ed8!important}
.drive-path-hint{display:block;margin-top:6px;font-size:11px;color:var(--text-mut);font-style:italic}
.std-search{margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.std-table-wrap{overflow-x:auto}
.std-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--white);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh-sm)}
.std-table thead th{padding:12px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;color:var(--text-sec);background:#f9fafb;border-bottom:1px solid var(--border);text-align:left}
.std-table tbody tr{cursor:pointer;transition:var(--tr)}
.std-table tbody tr:hover{background:#f9fafb}
.std-table tbody tr.std-main td{padding:12px 16px;font-size:13px;border-bottom:1px solid #f3f4f6;vertical-align:top}
.std-table tbody tr:last-child td{border-bottom:none}
.std-expand{display:none}
.std-expand.active{display:table-row}
.std-expand td{padding:16px 24px !important;font-size:13px;line-height:1.7;color:var(--text-sec);background:#f9fafb;border-bottom:1px solid #f3f4f6}
.std-expand h4{font-size:14px;font-weight:600;color:var(--text);margin:12px 0 4px}
.std-expand h4:first-child{margin-top:0}
.oem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:20px}
.oem-card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:24px;box-shadow:var(--sh-sm)}
.oem-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.oem-name{font-size:20px;font-weight:700;color:var(--text)}
.oem-product{font-size:13px;color:var(--text-sec)}
.oem-country{font-size:12px;color:var(--text-mut)}
.oem-count{font-size:28px;font-weight:700;color:var(--text);text-align:right}
.oem-count span{font-size:12px;font-weight:500;color:var(--text-sec);display:block}
.cov-wrap{margin-top:12px;overflow-x:auto}
.cov-table{width:100%;border-collapse:collapse;font-size:12px}
.cov-table th{padding:6px 10px;font-weight:600;color:var(--text-sec);text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.cov-table th:first-child{text-align:left}
.cov-table td{padding:6px 10px;text-align:center;border-bottom:1px solid #f3f4f6}
.cov-table td:first-child{text-align:left;font-weight:500;color:var(--text);white-space:nowrap;font-size:11px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.available{background:var(--c-safety)}
.dot.draft{background:#f59e0b}
.dot.missing{background:#e5e7eb}
.form-section{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:28px;box-shadow:var(--sh-sm);max-width:720px}
.form-section h2{font-size:18px;font-weight:700;margin-bottom:20px;color:var(--text)}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:14px;outline:none;transition:var(--tr);font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#6b7280;box-shadow:0 0 0 2px rgba(107,114,128,.15)}
.fg textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-primary{padding:10px 24px;background:#1f2937;color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;transition:var(--tr)}
.btn-primary:hover{background:#374151}
.btn-secondary{padding:10px 24px;background:var(--white);color:var(--text);border:1px solid var(--border);border-radius:var(--r);font-size:14px;font-weight:500;cursor:pointer;transition:var(--tr);margin-left:8px}
.btn-secondary:hover{background:#f3f4f6}
.added-list{margin-top:24px}
.added-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f9fafb;border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;font-size:13px}
.btn-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:13px;font-weight:600;padding:4px 8px;border-radius:4px;transition:var(--tr)}
.btn-del:hover{background:#fef2f2}
.empty{text-align:center;padding:60px 20px;color:var(--text-mut);font-size:14px}
.cat-badge-inline{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:#fff}
@media(max-width:768px){
.header{padding:0 12px}.header-center{display:none}.main{padding:12px}
.card-grid,.oem-grid{grid-template-columns:1fr}
.filter-row{flex-direction:column}.filter-input{min-width:0;width:100%}
.stats-bar{gap:8px}.stat-card{min-width:80px;padding:8px 12px}.form-row{grid-template-columns:1fr}
}
</style>
</head>

  h+=`<div class="stat-card st-draft"><div class="sv">${draft}</div><div class="sl">Draft</div></div>`;
  h+=`<div class="stat-card st-pend"><div class="sv">${pend}</div><div class="sl">Pending</div></div>`;
  h+='<div class="oem-badges">';
  oems.forEach(o=>{h+=`<div class="oem-mini">${o} <span class="ct">${oemCounts[o]||0}</span></div>`});
  h+='</div></div>';

  // Filter bar
  h+='<div class="filter-bar">';
  h+='<div class="filter-row">';
  h+=`<input class="filter-input" id="f-search" type="text" placeholder="Search certificates..." value="${filters.search}">`;
  h+=`<select class="filter-select" id="f-oem"><option value="">All OEMs</option>${oems.map(o=>`<option value="${o}"${filters.oem===o?' selected':''}>${o}</option>`).join('')}</select>`;
  h+=`<select class="filter-select" id="f-standard"><option value="">All Standards</option>${stds.map(s=>`<option value="${esc(s)}"${filters.standard===s?' selected':''}>${s}</option>`).join('')}</select>`;
  h+=`<select class="filter-select" id="f-component"><option value="">All Components</option>${comps.map(c=>`<option value="${esc(c)}"${filters.component===c?' selected':''}>${c}</option>`).join('')}</select>`;
  h+=`<select class="filter-select" id="f-status"><option value="">All Status</option><option value="available"${filters.status==='available'?' selected':''}>Available</option><option value="draft"${filters.status==='draft'?' selected':''}>Draft</option><option value="pending"${filters.status==='pending'?' selected':''}>Pending</option></select>`;
  h+=`<button class="btn-clear" id="f-clear">Clear All</button>`;
  h+='</div>';
  h+='<div class="cat-pills" id="cat-pills">';
  categories.forEach(cat=>{
    const active=filters.category===cat;
    h+=`<span class="cat-pill${active?' active':''}" data-cat="${esc(cat)}" style="${active?'background:'+catColor(cat)+';border-color:'+catColor(cat):'border-color:'+catColor(cat)+';color:'+catColor(cat)}">${cat}</span>`;
  });
  h+='</div></div>';

  // Results container
  h+='<div id="results-container"></div>';
  el.innerHTML=h;
  renderResults();
  bindFilterEvents();
}

function buildResultsHTML(){
  const certs=allCerts();
  let filtered=certs.filter(c=>{
    if(filters.search){const s=filters.search.toLowerCase();if(!(c.oem+c.product+c.standard+c.component+c.category+c.fileName+c.notes).toLowerCase().includes(s))return false}
    if(filters.oem&&c.oem!==filters.oem)return false;
    if(filters.standard&&c.standard!==filters.standard)return false;
    if(filters.component&&c.component!==filters.component)return false;
    if(filters.category&&c.category!==filters.category)return false;
    if(filters.status&&c.status!==filters.status)return false;
    return true;
  });
  filtered.sort((a,b)=>{
    if(filters.sort==='oem')return a.oem.localeCompare(b.oem)||a.standard.localeCompare(b.standard);
    if(filters.sort==='standard')return a.standard.localeCompare(b.standard)||a.oem.localeCompare(b.oem);
    if(filters.sort==='component')return a.component.localeCompare(b.component)||a.oem.localeCompare(b.oem);
    if(filters.sort==='category')return a.category.localeCompare(b.category)||a.oem.localeCompare(b.oem);
    return 0;
  });
  let h='';
  // Results meta
  h+='<div class="results-meta">';
  h+=`<span>Showing ${filtered.length} of ${certs.length} certificates</span>`;
  h+=`<select class="sort-select" id="f-sort"><option value="oem"${filters.sort==='oem'?' selected':''}>Sort: OEM</option><option value="standard"${filters.sort==='standard'?' selected':''}>Sort: Standard</option><option value="component"${filters.sort==='component'?' selected':''}>Sort: Component</option><option value="category"${filters.sort==='category'?' selected':''}>Sort: Category</option></select>`;
  h+='</div>';

  // Cards
  if(filtered.length===0){
    h+='<div class="empty">No certificates match your filters.</div>';
  } else {
    h+='<div class="card-grid">';
    filtered.forEach((c,i)=>{
      const cc=catColor(c.category);
      const kb=STANDARDS_KB[c.standardId];
      h+=`<div class="cert-card" data-idx="${i}">`;
      h+=`<div class="cert-card-inner"><div class="cert-card-border" style="background:${cc}"></div><div class="cert-card-body">`;
      h+=`<div class="cert-card-top"><span class="oem-badge">${esc(c.oem)}</span><span class="status-badge ${c.status}">${c.status}</span></div>`;
      h+=`<div class="cert-std">${esc(c.standard)}</div>`;
      h+=`<div class="cert-product">${esc(c.product)}</div>`;
      h+=`<div class="cert-chips"><span class="chip chip-comp">${esc(c.component)}</span><span class="chip chip-cat" style="background:${cc}">${c.category}</span></div>`;
      h+=`<div class="cert-file" title="${esc(c.fileName)}">${esc(c.fileName)}</div>`;
      h+=`</div></div>`;
      // Details
      h+=`<div class="cert-details">`;
      if(kb){
        h+=`<p><span class="dl">Standard:</span> ${esc(kb.title)}</p>`;
        h+=`<p><span class="dl">What it tests:</span> ${esc(kb.tests)}</p>`;
        h+=`<p><span class="dl">Why it matters:</span> ${esc(kb.matters)}</p>`;
        if(kb.indian&&kb.indian!=='—')h+=`<p><span class="dl">Indian equivalent:</span> ${esc(kb.indian)}</p>`;
      }
      if(c.notes)h+=`<p><span class="dl">Notes:</span> ${esc(c.notes)}</p>`;
      if(c.localPath)h+=`<p><span class="dl">Local path:</span> ${esc(c.localPath)}</p>`;
      if(c.driveLink)h+=`<a class="drive-btn" href="${esc(c.driveLink)}" target="_blank" rel="noopener">Open in Drive</a>`;
      else if(DRIVE_BASE_URL){
        const folderHint=c.localPath?c.localPath.split('/').slice(0,-1).join(' → '):'';
        h+=`<a class="drive-btn drive-browse" href="${DRIVE_BASE_URL}" target="_blank" rel="noopener" title="Navigate to: ${esc(folderHint)}">Browse in Drive</a>`;
        if(folderHint)h+=`<span class="drive-path-hint">📁 ${esc(folderHint)}</span>`;
      }
      else h+=`<span class="drive-pending">Drive link pending</span>`;
      h+=`</div></div>`;
    });
    h+='</div>';
  }
  return h;
}

function renderResults(){
  const rc=document.getElementById('results-container');
  if(!rc)return;
  rc.innerHTML=buildResultsHTML();
  // Bind sort event in results area
  const sortEl=document.getElementById('f-sort');
  if(sortEl)sortEl.addEventListener('change',e=>{filters.sort=e.target.value;renderResults()});
  // Bind card expand/collapse
  document.querySelectorAll('.cert-card').forEach(card=>card.addEventListener('click',e=>{
    if(e.target.closest('.drive-btn'))return;
    card.classList.toggle('expanded');
  }));
}

// After full render, bind filter bar events (these elements persist between renderResults calls)
function bindFilterEvents(){
  const searchEl=document.getElementById('f-search');
  searchEl.addEventListener('input',e=>{filters.search=e.target.value;renderResults()});
  document.getElementById('f-oem').addEventListener('change',e=>{filters.oem=e.target.value;render()});
  document.getElementById('f-standard').addEventListener('change',e=>{filters.standard=e.target.value;render()});
  document.getElementById('f-component').addEventListener('change',e=>{filters.component=e.target.value;render()});
  document.getElementById('f-status').addEventListener('change',e=>{filters.status=e.target.value;render()});
  document.getElementById('f-clear').addEventListener('click',()=>{filters={search:'',oem:'',standard:'',component:'',category:'',status:'',sort:filters.sort};render()});
  document.querySelectorAll('.cat-pill').forEach(p=>p.addEventListener('click',()=>{
    const cat=p.dataset.cat;filters.category=filters.category===cat?'':cat;render();
  }));
}
render();
})();

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ===== TAB 2: STANDARDS REFERENCE =====
(function(){
const el=document.getElementById('tab-standards');
let stdFilter='',stdCat='';
function renderStdResults(){
  const stds=Object.values(STANDARDS_KB);
  let filtered=stds.filter(s=>{
    if(stdFilter){const q=stdFilter.toLowerCase();if(!(s.std+s.title+s.category+s.tests+s.matters).toLowerCase().includes(q))return false}
    if(stdCat&&s.category!==stdCat)return false;
    return true;
  });
  let h='<div class="std-table-wrap"><table class="std-table"><thead><tr><th>Standard</th><th>Full Title</th><th>Category</th><th>Indian Eq.</th></tr></thead><tbody>';
  filtered.forEach(s=>{
    const cc=catColor(s.category);
    h+=`<tr class="std-main" data-sid="${s.id}"><td style="font-weight:600">${esc(s.std)}</td><td>${esc(s.title)}</td><td><span class="cat-badge-inline" style="background:${cc}">${s.category}</span></td><td>${esc(s.indian)}</td></tr>`;
    h+=`<tr class="std-expand" data-sid="${s.id}"><td colspan="4"><h4>What It Tests</h4><p>${esc(s.tests)}</p><h4>Why It Matters</h4><p>${esc(s.matters)}</p>${s.indian&&s.indian!=='—'?'<h4>Indian Equivalent</h4><p>'+esc(s.indian)+'</p>':''}</td></tr>`;
  });
  h+='</tbody></table></div>';
  const rc=document.getElementById('std-results');
  if(rc){rc.innerHTML=h;}
  document.querySelectorAll('.std-main').forEach(row=>row.addEventListener('click',()=>{
    const sid=row.dataset.sid;
    document.querySelectorAll('.std-expand').forEach(r=>{if(r.dataset.sid===sid)r.classList.toggle('active');else r.classList.remove('active')});
  }));
}
function render(){
  const stds=Object.values(STANDARDS_KB);
  const cats=[...new Set(stds.map(s=>s.category))].sort();
  let h='<div class="std-search">';
  h+=`<input class="filter-input" id="std-search" type="text" placeholder="Search standards..." value="${esc(stdFilter)}" style="max-width:400px">`;
  h+='<div class="cat-pills">';
  cats.forEach(cat=>{
    const active=stdCat===cat;
    h+=`<span class="cat-pill std-cat-pill${active?' active':''}" data-cat="${esc(cat)}" style="${active?'background:'+catColor(cat)+';border-color:'+catColor(cat):'border-color:'+catColor(cat)+';color:'+catColor(cat)}">${cat}</span>`;
  });
  h+='</div></div>';
  h+='<div id="std-results"></div>';
  el.innerHTML=h;
  renderStdResults();
  document.getElementById('std-search').addEventListener('input',e=>{stdFilter=e.target.value;renderStdResults()});
  document.querySelectorAll('.std-cat-pill').forEach(p=>p.addEventListener('click',()=>{stdCat=stdCat===p.dataset.cat?'':p.dataset.cat;render()}));
}
render();
})();

// ===== TAB 3: OEM OVERVIEW =====
(function(){
const el=document.getElementById('tab-oem');
function render(){
  const certs=allCerts();
  let h='<div class="oem-grid">';
  OEMS.forEach(oem=>{
    const oemCerts=certs.filter(c=>c.oem===oem.name);
    const components=[...new Set(oemCerts.map(c=>c.component))].sort();
    const standards=[...new Set(oemCerts.map(c=>c.standard))].sort();
    h+=`<div class="oem-card">`;
    h+=`<div class="oem-header"><div><div class="oem-name">${esc(oem.name)}</div><div class="oem-product">${esc(oem.product)}</div><div class="oem-country">${esc(oem.country)}</div></div><div class="oem-count">${oemCerts.length}<span>certificates</span></div></div>`;
    if(standards.length&&components.length){
      h+='<div class="cov-wrap"><table class="cov-table"><thead><tr><th></th>';
      components.forEach(comp=>{h+=`<th>${esc(comp)}</th>`});
      h+='</tr></thead><tbody>';
      standards.forEach(std=>{
        h+=`<tr><td>${esc(std)}</td>`;
        components.forEach(comp=>{
          const match=oemCerts.find(c=>c.standard===std&&c.component===comp);
          if(match)h+=`<td><span class="dot ${match.status}"></span></td>`;
          else h+=`<td><span class="dot missing"></span></td>`;
        });
        h+='</tr>';
      });
      h+='</tbody></table></div>';
    }
    h+='</div>';
  });
  h+='</div>';
  el.innerHTML=h;
}
render();
})();

// ===== TAB 4: ADD CERTIFICATE =====
(function(){
const el=document.getElementById('tab-add');
function render(){
  const local=getLocalCerts();
  const oemNames=[...new Set(OEMS.map(o=>o.name))].sort();
  const stdOpts=Object.values(STANDARDS_KB).map(s=>s.std).sort();
  const compOpts=['Cell','Pack','Rack/Cluster','Container/System','PCS','BMS','Fire Suppression','Transport','Other'];
  const statusOpts=['available','draft','pending'];
  let h=`<div class="form-section"><h2>Add New Certificate</h2>
  <div class="form-row"><div class="fg"><label>OEM</label><select id="add-oem"><option value="">Select OEM</option>${oemNames.map(o=>`<option value="${esc(o)}">${o}</option>`).join('')}<option value="__new">+ Add New OEM</option></select></div>
  <div class="fg" id="new-oem-wrap" style="display:none"><label>New OEM Name</label><input id="add-oem-new" type="text" placeholder="Enter OEM name"></div></div>
  <div class="fg"><label>Product</label><input id="add-product" type="text" placeholder="e.g. 5MWh Liquid Cooling BESS"></div>
  <div class="form-row"><div class="fg"><label>Standard</label><select id="add-std"><option value="">Select Standard</option>${stdOpts.map(s=>`<option value="${esc(s)}">${s}</option>`).join('')}<option value="__other">Other</option></select></div>
  <div class="fg"><label>Component</label><select id="add-comp">${compOpts.map(c=>`<option value="${esc(c)}">${c}</option>`).join('')}</select></div></div>
  <div class="form-row"><div class="fg"><label>Category</label><input id="add-cat" type="text" placeholder="Auto-filled from standard" readonly></div>
  <div class="fg"><label>Status</label><select id="add-status">${statusOpts.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div></div>
  <div class="fg"><label>File Name</label><input id="add-file" type="text" placeholder="certificate-file.pdf"></div>
  <div class="fg"><label>Drive Link</label><input id="add-drive" type="url" placeholder="https://drive.google.com/..."></div>
  <div class="fg"><label>Notes</label><textarea id="add-notes" placeholder="Any relevant notes..."></textarea></div>
  <div><button class="btn-primary" id="add-submit">Add Certificate</button><button class="btn-secondary" id="add-export">Export All as JSON</button></div></div>`;

  if(local.length){
    h+='<div class="added-list" style="max-width:720px;margin-top:20px"><h3 style="font-size:15px;font-weight:600;margin-bottom:12px">User-Added Certificates ('+local.length+')</h3>';
    local.forEach((c,i)=>{
      h+=`<div class="added-item"><div><strong>${esc(c.oem)}</strong> — ${esc(c.standard)} — ${esc(c.component)} <span class="status-badge ${c.status}" style="font-size:10px;padding:1px 6px">${c.status}</span></div><button class="btn-del" data-idx="${i}">Remove</button></div>`;
    });
    h+='</div>';
  }
  el.innerHTML=h;

  // OEM select
  document.getElementById('add-oem').addEventListener('change',e=>{
    document.getElementById('new-oem-wrap').style.display=e.target.value==='__new'?'block':'none';
  });
  // Auto category from standard
  document.getElementById('add-std').addEventListener('change',e=>{
    const kb=Object.values(STANDARDS_KB).find(s=>s.std===e.target.value);
    document.getElementById('add-cat').value=kb?kb.category:'';
  });
  // Submit
  document.getElementById('add-submit').addEventListener('click',()=>{
    const oemSel=document.getElementById('add-oem').value;
    const oem=oemSel==='__new'?document.getElementById('add-oem-new').value.trim():oemSel;
    const product=document.getElementById('add-product').value.trim();
    const standard=document.getElementById('add-std').value==='__other'?'Other':document.getElementById('add-std').value;
    const component=document.getElementById('add-comp').value;
    const category=document.getElementById('add-cat').value||'Other';
    const status=document.getElementById('add-status').value;
    const fileName=document.getElementById('add-file').value.trim();
    const driveLink=document.getElementById('add-drive').value.trim()||null;
    const notes=document.getElementById('add-notes').value.trim();
    if(!oem||!standard){alert('OEM and Standard are required.');return}
    const kb=Object.values(STANDARDS_KB).find(s=>s.std===standard);
    const cert={id:'user-'+Date.now(),oem,product,standard,standardId:kb?kb.id:'other',component,category,status,fileName,localPath:'',driveLink,notes,dateAdded:new Date().toISOString().slice(0,10)};
    const local=getLocalCerts();local.push(cert);setLocalCerts(local);
    render();
  });
  // Export
  document.getElementById('add-export').addEventListener('click',()=>{
    const data={certificates:allCerts(),oems:OEMS};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='certifdb-export.json';a.click();URL.revokeObjectURL(url);
  });
  // Delete
  document.querySelectorAll('.btn-del').forEach(btn=>btn.addEventListener('click',()=>{
    const local=getLocalCerts();local.splice(parseInt(btn.dataset.idx),1);setLocalCerts(local);render();
  }));
}
render();
})();
</script>
</body>
</html>
